services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'  # 0.5 core for Redis (lightweight)
          memory: 1G   # 1GB RAM for Redis
        reservations:
          cpus: '0.2'  # Minimum 0.2 core
          memory: 512M # Minimum 512MB RAM

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'  # 0.5 core for Nginx
          memory: 512M # 512MB RAM for Nginx
        reservations:
          cpus: '0.2'  # Minimum 0.2 core
          memory: 256M # Minimum 256MB RAM

  app:
    build: .
    container_name: fastapi-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '5.0'  # 5 cores for FastAPI app (multicore processing)
          memory: 12G  # 12GB RAM for app
        reservations:
          cpus: '2.0'  # Minimum 2 cores
          memory: 6G   # Minimum 6GB RAM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
