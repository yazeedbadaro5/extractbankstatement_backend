# -----------------------------
# Catch-all server (blocks IP access)
# -----------------------------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/api.extractbankstatement.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.extractbankstatement.com/privkey.pem;

    return 444;  # immediately close connection
}

# -----------------------------
# Redirect all HTTP requests to HTTPS
# -----------------------------
server {
    listen 80;
    server_name api.extractbankstatement.com;
    return 301 https://$host$request_uri;
}

# -----------------------------
# HTTPS server
# -----------------------------
server {
    listen 443 ssl;
    server_name api.extractbankstatement.com;

    ssl_certificate /etc/letsencrypt/live/api.extractbankstatement.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.extractbankstatement.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root endpoint
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_conn conn_limit_per_ip 10;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (if any)
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
